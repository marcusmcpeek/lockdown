---
DAL_TENANTS:
  - name: DAL_TENANTS
    mac_vrf_vni_base: 10000
    vrfs:
      - name: prod
        vrf_vni: 10
        vtep_diagnostic:
          loopback: 10
          loopback_ip_range: 172.16.255.0/24
        svis:
          - id: 10
            name: PROD_VLAN10
            enabled: true
            ip_address_virtual: 10.10.10.1/24
      - name: dev
        vrf_vni: 30
        vtep_diagnostic:
          loopback: 20
          loopback_ip_range: 172.16.254.0/24
        svis:
          - id: 30
            name: DEV_VLAN30
            enabled: true
            ip_address_virtual: 10.30.30.1/24
