---
pod_name: DAL_DC1

# Spine switches
spine:
  defaults:
    platform: vEOS-LAB
    bgp_as: "65100"
    loopback_ipv4_pool: 172.16.31.0/24
    bgp_defaults:
      - "no bgp default ipv4-unicast"
      - "distance bgp 20 200 200"
      - "graceful-restart restart-time 300"
      - "graceful-restart"
  nodes:
    - name: dalsp-1
      id: 1
      mgmt_ip: 192.168.0.11/24
    - name: dalsp-2
      id: 2
      mgmt_ip: 192.168.0.12/24
    - name: dalsp-3
      id: 3
      mgmt_ip: 192.168.0.13/24

# L3 Leaf switches
l3leaf:
  defaults:
    platform: vEOS-LAB
    loopback_ipv4_pool: 172.16.31.0/24
    loopback_ipv4_offset: 4
    vtep_loopback_ipv4_pool: 172.16.32.0/24
    uplink_switches: [dalsp-1, dalsp-2, dalsp-3]
    uplink_interfaces: [Ethernet49/1, Ethernet50/1, Ethernet51/1]
    mlag_interfaces: [Ethernet55/1, Ethernet56/1]
    uplink_ipv4_pool: 172.16.30.0/24
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
    bgp_defaults:
      - "no bgp default ipv4-unicast"
      - "distance bgp 20 200 200"
      - "graceful-restart restart-time 300"
      - "graceful-restart"
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
  node_groups:
    - group: DAL_DC1_LEAF1
      bgp_as: "65101"
      nodes:
        - name: dalle-1
          id: 1
          mgmt_ip: 192.168.0.14/24
          uplink_switch_interfaces: [Ethernet1/1, Ethernet1/1, Ethernet1/1]
        - name: dalle-2
          id: 2
          mgmt_ip: 192.168.0.15/24
          uplink_switch_interfaces: [Ethernet2/1, Ethernet2/1, Ethernet2/1]
    - group: DAL_DC1_LEAF2
      bgp_as: "65102"
      nodes:
        - name: dalle-3
          id: 3
          mgmt_ip: 192.168.0.16/24
          uplink_switch_interfaces: [Ethernet3/1, Ethernet3/1, Ethernet3/1]
        - name: dalle-4
          id: 4
          mgmt_ip: 192.168.0.17/24
          uplink_switch_interfaces: [Ethernet4/1, Ethernet4/1, Ethernet4/1]
    - group: DAL_DC1_LEAF3
      bgp_as: "65103"
      nodes:
        - name: dalle-5
          id: 5
          mgmt_ip: 192.168.0.18/24
          uplink_switch_interfaces: [Ethernet5/1, Ethernet5/1, Ethernet5/1]
        - name: dalle-6
          id: 6
          mgmt_ip: 192.168.0.19/24
          uplink_switch_interfaces: [Ethernet6/1, Ethernet6/1, Ethernet6/1]
    - group: DAL_DC1_LEAF4
      bgp_as: "65104"
      nodes:
        - name: dalle-7
          id: 7
          mgmt_ip: 192.168.0.20/24
          uplink_switch_interfaces: [Ethernet7/1, Ethernet7/1, Ethernet7/1]
        - name: dalle-8
          id: 8
          mgmt_ip: 192.168.0.21/24
          uplink_switch_interfaces: [Ethernet8/1, Ethernet8/1, Ethernet8/1]
